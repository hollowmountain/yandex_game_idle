<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Deep Core — генератор промоматериалов</title>
<style>
  body { background:#15121c; color:#ece7f0; font:14px "Segoe UI",system-ui,sans-serif; margin:0; padding:24px; }
  h1 { font-size:17px; font-weight:700; margin:0 0 4px; }
  p  { color:#9a91ab; margin:0 0 20px; max-width:70ch; line-height:1.55; }
  .row { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start; }
  figure { margin:0; }
  figcaption { color:#9a91ab; font-size:12px; margin-top:6px; }
  canvas { display:block; background:#000; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #icon { width:256px; height:256px; }
  #cover { width:800px; height:470px; }
  button { margin-top:20px; padding:10px 18px; border-radius:9px; background:#ffa62b; color:#1a1013; font-weight:700; border:0; cursor:pointer; }
  #log { margin-top:12px; color:#4ad991; font-size:13px; white-space:pre-line; }
</style>
</head>
<body>

<h1>Промоматериалы Deep Core</h1>
<p>
  Иконка и обложка рисуются кодом в тех же цветах и формах, что и сама игра.
  Требования платформы: иконка строго квадратная, без скруглений и рамок;
  ни иконка, ни обложка не могут быть скриншотом геймплея.
</p>

<div class="row">
  <figure><canvas id="icon" width="512" height="512"></canvas><figcaption>Иконка 512×512</figcaption></figure>
  <figure><canvas id="cover" width="800" height="470"></canvas><figcaption>Обложка 800×470</figcaption></figure>
</div>

<button id="save">Сохранить в shots/</button>
<div id="log"></div>

<script>
/* ---------- палитра и утилиты ---------- */
const C = {
  bg1:'#100c16', bg2:'#1c1524',
  accent:'#ffa62b', accent2:'#ff6b3d', accent3:'#ffd76b',
  steel1:'#514b5d', steel2:'#d4cee0', steel3:'#9d96a8', steel4:'#443f4e',
  bit1:'#a45a15', bit2:'#ffc978', bit3:'#954c15'
};
// слои породы — те же цвета, что в js/data.js
const STRATA = [
  ['#6b4f3a','#4c3728'], ['#8a6240','#63462d'], ['#63636e','#45454e'],
  ['#35353c','#1e1e23'], ['#8a5f4d','#5f4135'], ['#b08a2e','#7d6120'],
  ['#3f7ca8','#2b5875'], ['#3a2b4a','#211830'], ['#a83c1e','#5e2010'],
  ['#c2532a','#6d2812'], ['#e07a2f','#8a3d12'], ['#ffb347','#b06318']
];

function rnd32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const hex=c=>{const n=parseInt(c.slice(1),16);return [n>>16&255,n>>8&255,n&255];};
const rgba=(c,a)=>{const v=Array.isArray(c)?c:hex(c);return `rgba(${v[0]|0},${v[1]|0},${v[2]|0},${a})`;};
const mix=(a,b,t)=>{const A=Array.isArray(a)?a:hex(a),B=Array.isArray(b)?b:hex(b);
  return [A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t];};

/* гранёная порода — тот же приём, что в рендере игры */
function facets(g, x0, y0, w, h, col, dark, seed, count, scale){
  const r = rnd32(seed);
  g.save(); g.beginPath(); g.rect(x0,y0,w,h); g.clip();
  for(let i=0;i<count;i++){
    const px=x0+r()*w, py=y0+r()*h, rad=(10+r()*26)*scale, n=5+Math.floor(r()*3);
    const v=[];
    for(let k=0;k<n;k++){ const a=(k/n)*6.2832+(r()-.5)*.5, rr=rad*(.55+r()*.65);
      v.push([Math.cos(a)*rr, Math.sin(a)*rr]); }
    const sh=r();
    const cc = sh<.55 ? mix(col,dark,.2+sh*1.1) : mix(col,[255,255,255],(sh-.55)*.42);
    g.beginPath(); v.forEach((p,k)=>k?g.lineTo(px+p[0],py+p[1]):g.moveTo(px+p[0],py+p[1]));
    g.closePath(); g.fillStyle=rgba(cc,.8); g.fill();
    g.strokeStyle=rgba(dark,.5); g.lineWidth=1.1*scale; g.stroke();
  }
  g.restore();
}

/* ---------- буровая машина ---------- */
/* Одна и та же форма, что игрок видит в игре: корпус с предупреждающей
   полосой, боковые поршни, фара и конус с винтовой навивкой. */
function drill(g, cx, cy, s, spin){
  g.save(); g.translate(cx,cy); g.scale(s,s);

  const bg=g.createLinearGradient(-19,0,19,0);
  bg.addColorStop(0,C.steel1); bg.addColorStop(.3,C.steel2);
  bg.addColorStop(.62,C.steel3); bg.addColorStop(1,C.steel4);
  g.fillStyle=bg; g.fillRect(-19,-36,38,32);

  g.fillStyle=rgba([28,23,34],.8); g.fillRect(-19,-36,38,4.5); g.fillRect(-19,-12,38,3.5);
  g.fillStyle=C.accent; g.fillRect(-19,-21,38,5);
  g.fillStyle=rgba([26,16,19],.6);
  for(let i=-19;i<19;i+=9) g.fillRect(i,-21,4.5,5);

  g.fillStyle=rgba([38,32,46],.85);
  g.beginPath(); g.arc(-13,-30,1.8,0,6.2832); g.fill();
  g.beginPath(); g.arc(13,-30,1.8,0,6.2832); g.fill();
  g.fillStyle=rgba([255,226,160],.95);
  g.beginPath(); g.arc(0,-28,3.4,0,6.2832); g.fill();

  g.fillStyle='#67606f'; g.fillRect(-25,-30,6,18); g.fillRect(19,-30,6,18);
  g.fillStyle=rgba([150,142,160],.45); g.fillRect(-25,-30,1.6,18); g.fillRect(19,-30,1.6,18);

  g.beginPath(); g.moveTo(-15,-6); g.lineTo(15,-6); g.lineTo(0,34); g.closePath();
  const bit=g.createLinearGradient(-15,0,15,0);
  bit.addColorStop(0,C.bit1); bit.addColorStop(.38,C.bit2); bit.addColorStop(1,C.bit3);
  g.fillStyle=bit; g.fill();

  g.save(); g.clip();
  const SK=7;
  for(let i=0;i<7;i++){
    const t=((spin+i/7)%1), yy=-8+t*44;
    g.beginPath(); g.moveTo(-16,yy); g.lineTo(16,yy-SK);
    g.lineTo(16,yy-SK+3.6); g.lineTo(-16,yy+3.6); g.closePath();
    g.fillStyle=rgba([80,38,8],.5); g.fill();
    g.beginPath(); g.moveTo(-16,yy+3.6); g.lineTo(16,yy-SK+3.6);
    g.lineTo(16,yy-SK+4.9); g.lineTo(-16,yy+4.9); g.closePath();
    g.fillStyle=rgba([255,214,150],.24); g.fill();
  }
  g.restore();
  g.restore();
}

function glow(g,x,y,r,a){
  const rg=g.createRadialGradient(x,y,0,x,y,r);
  rg.addColorStop(0,rgba([255,232,165],.95*a));
  rg.addColorStop(.32,rgba([255,150,55],.55*a));
  rg.addColorStop(1,rgba([255,90,20],0));
  g.fillStyle=rg; g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill();
}

function sparks(g,x,y,n,seed,scale){
  const r=rnd32(seed);
  g.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    const a=-1.2+r()*2.4, d=(14+r()*70)*scale;
    g.globalAlpha=.35+r()*.6; g.fillStyle='#ffd489';
    const s=(1.4+r()*2.6)*scale;
    g.fillRect(x+Math.cos(a)*d, y+Math.sin(a)*d*.6, s, s);
  }
  g.globalCompositeOperation='source-over'; g.globalAlpha=1;
}

/* ---------- иконка ---------- */
/* Без текста: в каталоге иконка живёт размером с ноготь, любая надпись там
   превращается в грязь. Работает силуэт — конус долота и оранжевый жар. */
function drawIcon(){
  const cv=document.getElementById('icon'), g=cv.getContext('2d');
  const S=512;
  g.clearRect(0,0,S,S);

  const bg=g.createRadialGradient(S/2,S*.42,0,S/2,S*.5,S*.78);
  bg.addColorStop(0,'#2a1d2e'); bg.addColorStop(1,C.bg1);
  g.fillStyle=bg; g.fillRect(0,0,S,S);

  facets(g,0,0,S,S,'#6b4f3a','#38281c',7,26,1.9);
  g.fillStyle=rgba([0,0,0],.34); g.fillRect(0,0,S,S);

  // ствол шахты, растворённый по краям
  const sw=S*.42, sx=(S-sw)/2;
  const tun=g.createLinearGradient(0,0,0,S*.62);
  tun.addColorStop(0,rgba([10,8,13],.95)); tun.addColorStop(1,rgba([46,28,20],.72));
  const off=document.createElement('canvas'); off.width=sw; off.height=S*.66;
  const og=off.getContext('2d');
  og.fillStyle=tun; og.fillRect(0,0,sw,S*.66);
  og.globalCompositeOperation='destination-in';
  const mg=og.createLinearGradient(0,0,sw,0);
  mg.addColorStop(0,'rgba(0,0,0,0)'); mg.addColorStop(.22,'rgba(0,0,0,1)');
  mg.addColorStop(.78,'rgba(0,0,0,1)'); mg.addColorStop(1,'rgba(0,0,0,0)');
  og.fillStyle=mg; og.fillRect(0,0,sw,S*.66);
  og.globalCompositeOperation='destination-out';
  const bgd=og.createLinearGradient(0,S*.66-90,0,S*.66);
  bgd.addColorStop(0,'rgba(0,0,0,0)'); bgd.addColorStop(1,'rgba(0,0,0,1)');
  og.fillStyle=bgd; og.fillRect(0,S*.66-90,sw,90);
  g.drawImage(off,sx,0);

  glow(g,S/2,S*.72,S*.34,.55);
  drill(g,S/2,S*.44,4.15,.35);
  glow(g,S/2,S*.63,S*.2,.9);
  sparks(g,S/2,S*.64,16,3,2.1);

  // виньетка, чтобы силуэт не тонул в углах
  const v=g.createRadialGradient(S/2,S/2,S*.24,S/2,S/2,S*.72);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.55)');
  g.fillStyle=v; g.fillRect(0,0,S,S);
}

/* ---------- обложка ---------- */
/* Слои породы сверху вниз показывают весь путь игры к ядру, а название
   стоит в контрастной зоне слева, чтобы читаться в ленте каталога. */
function drawCover(){
  const cv=document.getElementById('cover'), g=cv.getContext('2d');
  const W=800,H=470;
  g.clearRect(0,0,W,H);

  // полосы слоёв
  const bands=STRATA.length;
  for(let i=0;i<bands;i++){
    const y0=H*i/bands, y1=H*(i+1)/bands;
    const [c1,c2]=STRATA[i];
    const lg=g.createLinearGradient(0,y0,0,y1);
    lg.addColorStop(0,c1); lg.addColorStop(1,c2);
    g.fillStyle=lg; g.fillRect(0,y0,W,y1-y0);
    facets(g,0,y0,W,y1-y0,c1,c2,11+i*7,9,1.05);
    g.fillStyle=rgba([0,0,0],.32); g.fillRect(0,y1-2,W,2);
  }

  // затемнение слева под текст
  const sh=g.createLinearGradient(0,0,W*.62,0);
  sh.addColorStop(0,rgba([8,6,11],.9)); sh.addColorStop(1,rgba([8,6,11],0));
  g.fillStyle=sh; g.fillRect(0,0,W,H);
  const vg=g.createLinearGradient(0,0,0,H);
  vg.addColorStop(0,rgba([8,6,11],.5)); vg.addColorStop(.5,rgba([8,6,11],0));
  vg.addColorStop(1,rgba([8,6,11],.55));
  g.fillStyle=vg; g.fillRect(0,0,W,H);

  // ствол и машина справа
  const cx=W*.72;
  const tunW=118;
  const tg=g.createLinearGradient(0,0,0,H*.52);
  tg.addColorStop(0,rgba([9,7,12],.92)); tg.addColorStop(1,rgba([52,32,22],.7));
  const off=document.createElement('canvas'); off.width=tunW; off.height=H*.56;
  const og=off.getContext('2d');
  og.fillStyle=tg; og.fillRect(0,0,tunW,H*.56);
  og.globalCompositeOperation='destination-in';
  const mg=og.createLinearGradient(0,0,tunW,0);
  mg.addColorStop(0,'rgba(0,0,0,0)'); mg.addColorStop(.22,'rgba(0,0,0,1)');
  mg.addColorStop(.78,'rgba(0,0,0,1)'); mg.addColorStop(1,'rgba(0,0,0,0)');
  og.fillStyle=mg; og.fillRect(0,0,tunW,H*.56);
  og.globalCompositeOperation='destination-out';
  const bd=og.createLinearGradient(0,H*.56-70,0,H*.56);
  bd.addColorStop(0,'rgba(0,0,0,0)'); bd.addColorStop(1,'rgba(0,0,0,1)');
  og.fillStyle=bd; og.fillRect(0,H*.56-70,tunW,70);
  g.drawImage(off,cx-tunW/2,0);

  // трос
  g.strokeStyle='#221d2b'; g.lineWidth=9; g.lineCap='round';
  g.beginPath(); g.moveTo(cx,-10);
  g.quadraticCurveTo(cx+7,H*.2,cx,H*.42); g.stroke();
  g.strokeStyle='#3b3348'; g.lineWidth=6; g.stroke();

  glow(g,cx,H*.72,190,.5);
  drill(g,cx,H*.5,2.5,.35);
  glow(g,cx,H*.62,86,.95);
  sparks(g,cx,H*.63,22,5,1.35);

  // название
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.font='800 15px "Segoe UI",system-ui,sans-serif';
  g.fillStyle=rgba(C.accent,.9);
  g.fillText('IDLE · ШАХТА · ЯДРО ПЛАНЕТЫ', 46, 178);

  g.font='900 74px "Segoe UI",system-ui,sans-serif';
  g.lineWidth=9; g.strokeStyle=rgba([8,6,11],.85);
  g.strokeText('DEEP', 44, 254); g.strokeText('CORE', 44, 326);
  g.fillStyle='#ffffff'; g.fillText('DEEP', 44, 254);
  const tg2=g.createLinearGradient(44,270,300,330);
  tg2.addColorStop(0,C.accent3); tg2.addColorStop(.5,C.accent); tg2.addColorStop(1,C.accent2);
  g.fillStyle=tg2; g.fillText('CORE', 44, 326);

  g.fillStyle=rgba(C.accent,.95); g.fillRect(46,348,86,5);
  g.font='600 17px "Segoe UI",system-ui,sans-serif';
  g.fillStyle=rgba([236,231,240],.82);
  g.fillText('Копай сквозь 12 слоёв породы', 46, 384);
}

/* ---------- сохранение ---------- */
document.getElementById('save').addEventListener('click', async () => {
  const log=document.getElementById('log');
  log.textContent='';
  for (const [id,name] of [['icon','icon-512.png'],['cover','cover-800x470.png']]) {
    const blob = await new Promise(r => document.getElementById(id).toBlob(r,'image/png'));
    const res = await fetch('/shot?name='+name,{method:'POST',body:blob});
    log.textContent += (await res.text()) + '\n';
  }
});

drawIcon();
drawCover();
</script>
</body>
</html>
